# Master-stack layout
new_is_master=1    # Open new window as master by default
default_mfact=0.55 # Master relative scale
default_nmaster=1
smartgaps=0

# Overview
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
